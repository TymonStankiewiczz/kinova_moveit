controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    # Wyżej niż domyślne 20Hz - przy planowanym sterowaniu kartezjańskim
    # (compute_cartesian_path + czekanie na wykonanie) to skraca próg
    # wykrycia zakończenia małego ruchu - patrz README, sekcja o płynności.
    action_monitor_rate: 100.0
    allow_partial_joints_goal: false
